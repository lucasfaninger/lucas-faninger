<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucas Faninger, software engineer</title>
<meta name="description" content="Software engineer for industrial systems (.NET, OPC UA, Azure) between Alsace and Basel. A 2-minute tour of my career as a pixel-art game, in French, German and English.">
<meta name="author" content="Lucas Faninger">
<meta name="theme-color" content="#1d2433">
<meta property="og:type" content="website">
<meta property="og:title" content="Lucas Faninger, software engineer">
<meta property="og:description" content="My career as a 2-minute pixel-art tour: industrial software, .NET, OPC UA and Azure, between Alsace and Basel.">
<meta property="og:image" content="og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --gh:56vh; --vh:100vh;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --night:#1d2433; --paper:#eef1f4; --ink:#1d2433; --muted:#56627a; --yellow:#f2c230; --line:#1d2433; --chip:#dfe5ec; --btn:#e2e7ee;
  --pixel:"Pixelify Sans","Courier New",monospace;
  --text:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#273047; --ink:#eef1f4; --muted:#aeb8cc; --chip:#34405c; --line:#0e1320; --btn:#34405c; }
}
:root[data-theme="dark"]{ --paper:#273047; --ink:#eef1f4; --muted:#aeb8cc; --chip:#34405c; --line:#0e1320; --btn:#34405c; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--text)}
#scroller{width:1px}
#textlayer{position:fixed;top:0;left:0;pointer-events:none;z-index:1}
#starbg{position:fixed;inset:0;width:100%;height:100%;opacity:0;transition:opacity 1s;pointer-events:none}
body.finale #starbg{opacity:1}
body.finale{background:#06081a}
#game{position:fixed;top:0;left:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:pan-y}

#topbar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:6}
#timeline{display:flex;gap:4px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;min-width:0;flex:0 1 auto}
#timeline::-webkit-scrollbar{display:none}
.pxbtn{font-family:var(--pixel);font-size:14px;line-height:1;padding:7px 9px;border:2px solid var(--line);background:#2b3550;color:#dfe5ec;cursor:pointer;white-space:nowrap;box-shadow:2px 2px 0 var(--line)}
.pxbtn:hover{background:#3b4a6b}
#timeline .pxbtn[aria-current="step"]{background:var(--yellow);color:#1d2433}
#subnav{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:12px;display:none;gap:4px;z-index:6;overflow-x:auto;scrollbar-width:none;max-width:calc(100vw - 470px)}
#subnav.on{display:flex}
#progress{position:fixed;top:calc(44px + env(safe-area-inset-top,0px));left:12px;width:min(560px,calc(100vw - 460px));height:5px;background:rgba(14,19,32,.7);border:1px solid #0e1320;z-index:5}
#progress i{display:block;height:100%;width:0;background:var(--yellow)}
body.branch #progress i{background:#4aa3e8}
#subnav::-webkit-scrollbar{display:none}
#subnav .pxbtn{font-size:13px;padding:5px 8px;background:#3b4a6b;box-shadow:2px 2px 0 var(--line)}
#subnav.on~#mode,body:has(#subnav.on) #mode{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
#subnav .lead{background:rgba(29,36,51,.9)}
#subnav .pxbtn[aria-current="step"]{background:#f7dc7a;color:#1d2433}
#subnav .lead{font-family:var(--pixel);font-size:13px;color:#aeb8cc;align-self:center;padding:0 4px 0 2px;white-space:nowrap}
#tools{margin-left:auto;display:flex;gap:6px;pointer-events:auto;flex:none}
#langs{display:flex}
#soundbtn{min-width:40px}
#langs .pxbtn{box-shadow:none;padding:7px 7px;margin-left:-2px}
#langs .pxbtn:first-child{margin-left:0}
#langs .pxbtn[aria-pressed="true"]{background:var(--yellow);color:#1d2433}
#textbtn{background:#eef1f4;color:#1d2433}
#textbtn:hover{background:#fff}
button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

#hint{position:fixed;left:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(560px,calc(100vw - 460px));font-family:var(--pixel);font-size:15px;line-height:1.35;color:#eef1f4;background:rgba(29,36,51,.9);border:2px solid var(--line);padding:8px 10px;z-index:4;transition:opacity .4s}
#hint{pointer-events:none}
#hint.gone{opacity:0;pointer-events:none}
#place{position:fixed;top:calc(58px + env(safe-area-inset-top,0px));left:calc((100vw - 420px)/2);transform:translateX(-50%);font-family:var(--pixel);color:#eef1f4;background:rgba(29,36,51,.92);border:2px solid var(--yellow);box-shadow:3px 3px 0 #0e1320;padding:7px 14px;z-index:4;opacity:0;transition:opacity .35s;pointer-events:none;text-align:center;white-space:nowrap}
#place.on{opacity:1}
#place b{display:block;font-size:20px;font-weight:600}
#place small{display:block;font-size:13px;color:var(--yellow)}
#hint kbd{font-family:var(--pixel);background:var(--yellow);color:#1d2433;padding:0 4px;margin:0 1px}

#panel{position:fixed;right:16px;top:calc(60px + env(safe-area-inset-top,0px));width:min(390px,36vw);max-height:calc(100% - 80px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;background:var(--paper);border:3px solid var(--line);box-shadow:6px 6px 0 var(--line);padding:20px 22px 18px;z-index:5}
#panel-body{transition:opacity .18s}
#panel-body.swap{opacity:0}
.when{font-family:var(--pixel);font-size:15px;margin:0 0 6px;color:var(--muted)}
#panel h2{font-family:var(--pixel);font-weight:700;font-size:28px;line-height:1.05;margin:0 0 6px}
.org{margin:0 0 12px;font-weight:700}
.desc{margin:0 0 12px;color:var(--muted);font-style:italic;line-height:1.45}
.about{margin:8px 0 4px;color:var(--muted);font-size:14px;line-height:1.45}
.about span{font-family:var(--pixel);font-size:13px;color:var(--ink);margin-right:4px}
.teaser{margin:16px 0 0;padding:10px 12px;border:2px dashed var(--muted);font-family:var(--pixel);font-size:15px;line-height:1.35}
.teaser::before{content:"→ ";color:var(--yellow);text-shadow:1px 1px 0 #1d2433}
.godown.start{display:block;width:100%;margin:6px 0 4px;font-size:16px;padding:10px 12px}
ul.points{margin:0 0 4px;padding-left:18px;line-height:1.5}
ul.points li{margin-bottom:6px}
.stackh{font-family:var(--pixel);font-size:15px;margin:12px 0 6px}
ul.stack{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
ul.stack li{font-size:12.5px;padding:2px 7px;border:2px solid var(--muted);color:var(--ink)}
#panel a{color:inherit}
.contact{margin:14px 0 0;line-height:1.5}
.inspect{margin-top:14px}
.inspect-h{font-family:var(--pixel);font-size:15px;margin:0 0 6px}
.hsbtns{display:flex;flex-wrap:wrap;gap:6px}
.hsbtn{font-family:var(--text);font-size:14px;padding:5px 9px;border:2px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--line)}
.hsbtn::before{content:"";display:inline-block;width:7px;height:7px;background:var(--yellow);border:1px solid #1d2433;transform:rotate(45deg);margin-right:7px;vertical-align:1px}
.hsbtn.seen::before{background:#4fd17a}
.hsbtn.proj::before{display:none}
.godown,.goback{font-family:var(--pixel);font-size:15px;border:2px solid var(--line);background:var(--yellow);color:#1d2433;padding:7px 11px;cursor:pointer;box-shadow:3px 3px 0 var(--line);margin:0 0 10px}
.goback{margin:0 0 12px;background:#2b3550;color:#eef1f4}
.contactbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
a.godown{display:inline-block;text-decoration:none;margin:0}
a.godown.li{background:#0a66c2;color:#fff}
.godown:hover,.goback:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--line)}
.hsbtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--line)}
#inv{margin-top:16px;padding-top:12px;border-top:2px dashed var(--muted)}
#inv h3{font-family:var(--pixel);font-weight:600;font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
#found{background:#2b3550;color:#eef1f4;cursor:default;box-shadow:none;display:flex;align-items:center;gap:6px}
#found::before{content:"";width:7px;height:7px;background:var(--yellow);border:1px solid #1d2433;transform:rotate(45deg)}
#invlist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
#invlist li{font-size:13px;padding:3px 7px;background:var(--chip);border:2px solid var(--line)}
#invlist li.new{animation:pop .6s steps(4)}
@keyframes pop{0%{transform:scale(.4);background:var(--yellow);color:#1d2433}60%{transform:scale(1.15);background:var(--yellow);color:#1d2433}100%{transform:scale(1)}}
#invlist .empty{background:none;border:none;padding:0;color:var(--muted);font-style:italic}

#detail{position:fixed;left:16px;bottom:16px;width:min(440px,calc(100vw - 470px));min-width:260px;max-height:calc(100% - 90px);overflow:auto;background:#1d2433;color:#eef1f4;border:3px solid var(--yellow);box-shadow:6px 6px 0 #0e1320;padding:16px 18px 14px;z-index:7;display:none}
#detail.open{display:block;animation:open .22s steps(3)}
@keyframes open{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
#detail .where{font-family:var(--pixel);font-size:14px;color:var(--yellow);margin:0 0 4px}
#detail h3{font-family:var(--pixel);font-size:24px;margin:0 0 8px;line-height:1.1;padding-right:70px}
#detail p.body{margin:0 0 10px;line-height:1.5}
#detail ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
#detail li{font-size:13px;padding:2px 7px;border:2px solid #56688a;color:#dfe5ec}
#detail-link{margin:10px 0 0;font-size:14px;line-height:1.5}
#detail-link:empty{display:none}
#detail-link a{color:var(--yellow)}
#detail-link span{color:#aeb8cc}
#detail-link .godown{margin:0}
#detailclose{position:absolute;top:10px;right:10px;font-family:var(--pixel);font-size:14px;background:var(--yellow);color:#1d2433;border:2px solid #0e1320;padding:5px 8px;cursor:pointer}
#detail{position:fixed}

#mode{display:none;position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-family:var(--pixel);font-size:14px;color:#1d2433;background:var(--yellow);border:2px solid var(--line);padding:6px 9px;z-index:4}
#mode.on{display:block}
#menubtn{display:none;pointer-events:auto;font-size:15px;padding:8px 12px;background:var(--yellow);color:#1d2433}
#mnav{position:fixed;inset:0;z-index:20;background:rgba(14,19,32,.75);padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
#mnav[hidden]{display:none}
.mnav-in{background:var(--paper);color:var(--ink);border:3px solid var(--line);box-shadow:6px 6px 0 #0e1320;max-height:100%;overflow:auto;padding:14px 16px 18px}
.mnav-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mnav-name{font-family:var(--pixel);font-size:22px;margin:0}
#mnav-close{background:#2b3550;color:#eef1f4;font-size:16px;min-width:44px;min-height:40px}
#mnav-steps{list-style:none;margin:0 0 14px;padding:0}
#mnav-steps li{margin:0 0 6px}
#mnav-steps button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;font-family:var(--text);font-size:16px;padding:9px 10px;border:2px solid var(--line);background:var(--btn);color:var(--ink);cursor:pointer;min-height:44px}
#mnav-steps button b{font-family:var(--pixel);font-size:15px;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:#2b3550;color:#eef1f4}
#mnav-steps button small{display:block;color:var(--muted);font-size:13px}
#mnav-steps button[aria-current="step"]{background:var(--yellow);color:#1d2433}
#mnav-steps button[aria-current="step"] small{color:#3b4255}
#mnav-steps .sub button{margin-left:22px;width:calc(100% - 22px);font-size:15px;min-height:40px}
#mnav-steps .sub button b{background:#4aa3e8;color:#1d2433}
#mnav-langs{display:flex;gap:6px;margin:0 0 12px}
#mnav-langs .pxbtn{font-size:15px;padding:8px 14px;box-shadow:none}
#mnav-langs .pxbtn[aria-pressed="true"]{background:var(--yellow);color:#1d2433}
#stepLabel{pointer-events:auto;cursor:pointer}
body.finale #stepnav{top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#stepnav{display:none;position:fixed;left:8px;right:8px;top:calc(var(--gh) - 52px);z-index:6;align-items:center;gap:8px;pointer-events:none}
#stepnav .pxbtn{pointer-events:auto;font-size:20px;min-width:52px;min-height:44px;padding:6px 12px;background:var(--yellow);color:#1d2433}
#stepnav .pxbtn:disabled{background:#3b4255;color:#7a8496;box-shadow:none}
#stepnav span{flex:1;text-align:center;font-family:var(--pixel);font-size:14px;color:#eef1f4;background:rgba(29,36,51,.88);border:2px solid var(--line);padding:7px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.detail-open #mode,body.detail-open #subnav{display:none}

#endcard{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 470px));min-width:280px;background:var(--paper);color:var(--ink);border:3px solid var(--yellow);box-shadow:8px 8px 0 #0e1320;padding:20px 22px;z-index:7}
#endcard[hidden]{display:none}
#panel,#hint,#subnav,#detail{transition:opacity .6s}
body.finale #panel,body.finale #hint,body.finale #subnav,body.finale #detail,body.finale #place{opacity:0;pointer-events:none}
body.finale #endcard{left:50%;animation:endIn .6s ease-out both}
@keyframes endIn{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
@media (prefers-reduced-motion: reduce){ body.finale #endcard{animation:none} }
#endcard h2{font-family:var(--pixel);font-size:26px;margin:0 0 10px}
#endcard ul{margin:0 0 12px;padding-left:18px;line-height:1.5}
#endcard #end-found{font-family:var(--pixel);font-size:15px;margin:0 0 6px}
#endcard .contactbtns{margin-top:12px}
#endcard button.godown{margin:0}
dialog{max-width:720px;width:calc(100% - 24px);max-height:calc(100% - 24px);border:3px solid var(--line);box-shadow:8px 8px 0 #0e1320;padding:28px 30px;background:var(--paper);color:var(--ink);font-family:var(--text);line-height:1.5}
dialog::backdrop{background:rgba(14,19,32,.7)}
dialog h2{font-family:var(--pixel);font-size:32px;margin:0 0 4px}
dialog h3{font-family:var(--pixel);font-size:20px;margin:26px 0 8px}
dialog h4{margin:16px 0 2px;font-size:17px}
dialog .meta{color:var(--muted);margin:0 0 4px}
dialog ul{margin:4px 0;padding-left:20px}
#msgdlg{max-width:520px}
#msgdlg h2{font-size:26px;margin:0 0 14px}
#msgdlg label{display:block;margin:0 0 12px;font-weight:700}
#msgdlg label span{display:block;margin-bottom:4px}
#msgdlg input,#msgdlg textarea{width:100%;font:inherit;font-weight:400;padding:8px 10px;border:2px solid var(--line);background:var(--chip);color:var(--ink)}
#msgdlg input:focus-visible,#msgdlg textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:1px}
#closemsg{float:right;font-family:var(--pixel);font-size:15px;border:2px solid var(--line);background:var(--yellow);color:#1d2433;padding:6px 10px;cursor:pointer}
#closetext{float:right;font-family:var(--pixel);font-size:15px;border:2px solid var(--line);background:var(--yellow);color:#1d2433;padding:6px 10px;cursor:pointer}

@media (max-width:760px){
  #panel{left:8px;right:8px;width:auto;top:calc(var(--gh) + 4px);bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:none;padding:14px 16px;box-shadow:4px 4px 0 var(--line)}
  #panel h2{font-size:22px}
  #mode{bottom:auto;top:calc(52px + env(safe-area-inset-top,0px))}
  #hint{top:auto;bottom:calc(var(--vh) - var(--gh) + 58px);right:12px;max-width:none;font-size:14px}
  #stepnav{display:flex}
  #detail{left:8px;right:8px;width:auto;min-width:0;bottom:auto;top:calc(52px + env(safe-area-inset-top,0px));max-height:calc(var(--gh) - 60px)}
  #detail h3{font-size:20px}
  .pxbtn{font-size:13px;padding:7px 7px}
  #textbtn .long{display:none}
  #timeline,#found,#textbtn,#subnav,#subnav.on{display:none}
  #menubtn{display:inline-block}
  #langs .pxbtn{min-width:40px;min-height:36px;font-size:14px}
  #endcard{left:8px;right:8px;width:auto;min-width:0;top:calc(52px + env(safe-area-inset-top,0px));transform:none;max-height:calc(var(--gh) - 60px);overflow:auto}
  body.finale #endcard{left:50%;right:auto;width:calc(100vw - 24px);top:50%;transform:translate(-50%,-50%);max-height:calc(100% - 140px)}
  #progress{width:calc(100vw - 24px)}
  #found::before{display:none}
  #place{left:50%;top:calc(52px + env(safe-area-inset-top,0px))}
  #subnav{max-width:calc(100vw - 24px);bottom:auto;top:calc(var(--gh) - 92px)}
}
@media (min-width:761px){ #textbtn .short{display:none} }
@media (hover:none) and (pointer:coarse){ body.finale #endcard{left:50%;right:auto;top:50%;transform:translate(-50%,-50%);max-height:calc(100% - 140px)} #timeline,#found,#textbtn,#subnav,#subnav.on{display:none} #langs .pxbtn{min-width:40px;min-height:36px;font-size:14px} #menubtn{display:inline-block} #stepnav{display:flex} #hint{top:auto;bottom:calc(var(--vh) - var(--gh) + 58px)} }
@media (prefers-reduced-motion: reduce){ #detail.open,#invlist li.new{animation:none} }
</style>
</head>
<body>
<noscript><p style="color:#eef1f4;padding:20px;font-family:sans-serif">This portfolio is an interactive game and needs JavaScript. Contact: lucas.faninger@gmail.com</p></noscript>
<canvas id="starbg" aria-hidden="true"></canvas>
<canvas id="game" role="img"></canvas>
<canvas id="textlayer" aria-hidden="true"></canvas>
<div id="scroller"></div>

<div id="topbar">
  <button id="menubtn" class="pxbtn" type="button" aria-haspopup="dialog">☰ Menu</button>
  <nav id="timeline"></nav>
  <div id="tools">
    <div id="langs" role="group" aria-label="Language">
      <button class="pxbtn" type="button" data-lang="fr">FR</button>
      <button class="pxbtn" type="button" data-lang="de">DE</button>
      <button class="pxbtn" type="button" data-lang="en">EN</button>
    </div>
    <button id="soundbtn" class="pxbtn" type="button" aria-pressed="false">🔇</button>
    <span id="found" class="pxbtn" role="status"></span>
    <button id="textbtn" class="pxbtn" type="button"><span class="long"></span><span class="short">CV</span></button>
  </div>
</div>
<div id="progress" aria-hidden="true"><i></i></div>
<nav id="subnav" aria-label="microtom"></nav>
<div id="hint"></div>
<div id="stepnav"><button type="button" id="prevStep" class="pxbtn">◀</button><span id="stepLabel"></span><button type="button" id="nextStep" class="pxbtn">▶</button></div>
<div id="place" aria-live="polite"></div>
<div id="mode"></div>

<aside id="panel" aria-live="polite">
  <div id="panel-body"></div>
</aside>

<section id="detail" role="dialog" aria-labelledby="detail-title">
  <button id="detailclose" type="button"></button>
  <p class="where" id="detail-where"></p>
  <h3 id="detail-title"></h3>
  <p class="body" id="detail-body"></p>
  <ul id="detail-tags"></ul>
  <p id="detail-link"></p>
</section>

<section id="endcard" aria-live="polite" hidden>
  <h2 id="end-title"></h2>
  <ul id="end-lines"></ul>
  <p id="end-found"></p>
  <div class="contactbtns" id="end-btns"></div>
</section>
<div id="mnav" role="dialog" aria-modal="true" aria-label="Menu" hidden>
  <div class="mnav-in">
    <div class="mnav-top"><p class="mnav-name">Lucas Faninger</p><button type="button" id="mnav-close" class="pxbtn">✕</button></div>
    <ol id="mnav-steps"></ol>
    <div id="mnav-langs"></div>
    <div class="contactbtns"><button type="button" id="mnav-msg" class="godown"></button><button type="button" id="mnav-cv" class="godown goback"></button><button type="button" id="mnav-text" class="godown goback"></button></div>
  </div>
</div>

    smc_screen:{t:"Live power curve",d:"Two processes: one listens to OPC UA and stores each change, the other draws the live curve. The history app then computes kWh over any period (average watts × hours ÷ 1000) and exports to Excel, Word, PDF or email."},

    dc_logs:{t:"Production support",d:"After reboots, the app sometimes crashed on startup at the client's site. Correlating its logs with the Windows Event Viewer showed the domain network wasn't ready yet, so startup calls hung past the IIS limit. Fix: a longer limit and network calls decoupled from startup."},

    lobby_map:{t:"Trois frontières",d:"Je vis en Alsace et travaille près de Bâle, là où la France, l'Allemagne et la Suisse se rejoignent. Mon parcours a traversé les trois pays : je travaille en français, en allemand et en anglais."},

    lobby_shoes:{t:"Course et randonnée",d:"Chaussures de course, chaussures de rando, sac à dos et la balle du chien près de la porte : je me suis entraîné pour un marathon, et les week-ends sont faits pour les longues randos avec le teckel."},

    lobby_globe:{t:"Voyages",d:"J'adore voyager et découvrir de nouvelles cultures. Vivre là où trois pays se rejoignent, c'est déjà un bon début."},
    sel_cabinet:{t:"Électrotechnique",d:"Électrotechnique, technique du bâtiment, automatisation : chez Selmoni, j'ai découvert de près le monde des installations techniques."},
    sel_diagram:{t:"Jobs d'été",d:"Plusieurs étés de suite : une première expérience du travail en équipe dans une entreprise technique."},
    sel_excel:{t:"Excel et VBA",d:"Ma première automatisation : des scripts Excel (VBA) pour épargner aux équipes les tâches répétitives. Le début d'un fil rouge dans mon parcours."},
    lobby_dog:{t:"Le teckel",d:"Mon teckel arlequin. Ce panier est le sien, mais il préfère vous suivre. Lancez-lui la balle rouge près de l'entrée !"},
    lobby_kitchen:{t:"Cuisine",d:"J'adore cuisiner, et pas seulement au barbecue : une cocotte en fonte sur le feu, des bocaux de kimchi et de cornichons qui fermentent, et le moule à kougelhopf, incontournable en Alsace."},
    lobby_stove:{t:"Le poêle en faïence",d:"Le Kachelofen, cœur chaud de la maison alsacienne. Quand il ne vous suit pas, c'est ici que le teckel fait la sieste."},
    cesi_board:{t:"Tableau blanc",d:"P = U × I : la formule au cœur de mon projet chez SMCOM, où j'ai mesuré la puissance de machines avec de vrais capteurs. Au CESI, la théorie finissait toujours dans un projet de ce genre."},
    cesi_dip:{t:"Diplôme",d:"Master en informatique, obtenu en 2022 après cinq ans d'école d'ingénieurs."},
    cesi_scrum:{t:"Gestion de projet agile",d:"Sprints, backlog et tableau de tâches : les projets de groupe se menaient en méthode agile, jusqu'à la présentation finale."},
    cesi_net:{t:"Réseaux",d:"Adressage, routage, commutation, VLAN : configurer et dépanner un réseau. Une base qui m'a servi dès mon stage en salle serveur."},
    cesi_linux:{t:"Systèmes et Linux",d:"Administration système, ligne de commande et scripts : comprendre ce qui tourne sous les applications."},
    cesi_oop:{t:"Programmation orientée objet",d:"Classes, héritage, design patterns et diagrammes UML : les fondations de mon travail en C# aujourd'hui."},
    cesi_db:{t:"Bases de données",d:"Modéliser les données, puis les interroger en SQL : une compétence que j'utilise dans presque chaque projet."},
    cesi_sec:{t:"Cybersécurité",d:"Bonnes pratiques, failles courantes et protection des systèmes : penser sécurité dès la conception."},

    cesi_vr:{t:"Spécialisation AR et VR",d:"En cinquième année, je me suis spécialisé en réalité augmentée et réalité virtuelle : concevoir des expériences immersives en 3D."},
    cesi_ai:{t:"IA et data",d:"Analyse de données et premiers modèles d'intelligence artificielle : une curiosité qui m'a mené jusqu'à l'IA agentique aujourd'hui."},
    cesi_shelf:{t:"Bibliothèque",d:"Apprentissage par problèmes : chaque module part d'un problème concret, résolu en équipe, et se termine par une présentation devant un jury."},
    gies_racks:{t:"Salle serveur",d:"Ajout d'un contrôleur de domaine Windows Server 2016 à l'Active Directory existant, et gestion des demandes quotidiennes : comptes AD, partages de fichiers et boîtes Exchange."},
    gies_desk:{t:"Clients légers",d:"La plupart des utilisateurs travaillaient sur des clients légers Dell Wyse. J'ai installé Wyse Device Manager pour les configurer de façon centralisée ; les clients trouvent le serveur grâce aux options DHCP 186 et 192."},
    cob_cabinets:{t:"Archives papier",d:"Les sociétés du groupe rangeaient leurs documents dans des classeurs. Avec EzGED, ils sont scannés, lus par OCR et indexés. J'ai écrit les masques d'extraction : des règles regex et Python qui récupèrent numéros de facture, dates et montants, et relient une facture à sa commande."},
    cob_tablet:{t:"Tablette d'atelier",d:"Une tablette par presse à injecter. L'opérateur se connecte avec un badge NFC, voit ses tâches planifiées, puis déclare la production et les rebuts. Les données machine viennent d'un boîtier d'acquisition ADDI-DATA via MQTT ; j'ai développé le front-end AngularJS."},
    smc_cnc:{t:"Machine CNC",d:"Les machines-outils anciennes ne savent pas transmettre leur consommation par protocole. On la mesure donc : une pince ampèremétrique et un capteur de tension sur les moteurs, puis P = U × I × cos φ en courant alternatif."},
    smc_moxa:{t:"Module d'E/S Moxa",d:"Le ioLogik 2542 envoie ses entrées analogiques au serveur OPC UA uniquement quand une valeur change. Mon application s'abonne à ces tags au lieu d'interroger le serveur chaque seconde, ce qui limite le trafic réseau et les écritures en base."},
    smc_screen:{t:"Courbe en direct",d:"Deux processus : l'un écoute OPC UA et enregistre chaque changement, l'autre affiche la courbe en direct. L'application d'historique calcule ensuite les kWh sur n'importe quelle période (watts moyens × heures ÷ 1000) et exporte vers Excel, Word, PDF ou par e-mail."},
    pk_wall:{t:"Dashboard mural",d:"C'est ce que vend Peakboard : un boîtier qui récupère des données en direct depuis SAP, des machines ou Excel et les affiche sur les écrans de l'atelier. Une nouvelle version sort chaque mois, d'où le besoin de tests rapides."},
    pk_laptop:{t:"Lanceur de tests",d:"Les tests WPF sous Telerik Test Studio lancent de vrais templates dans le runtime Peakboard et utilisent des captures d'écran pour repérer les erreurs. Un bot Slack en C# dialogue avec l'API Slack en WebSocket : n'importe qui lance la suite d'une commande et reçoit les résultats dans le canal."},
    mt_tanks:{t:"Installation de process",d:"Dans la pharma et l'industrie de process, le logiciel doit suivre l'installation : alarmes, événements et données de production issues des systèmes de contrôle, dans des environnements aux règles de sécurité et de qualité strictes."},
    mt_plc:{t:"Armoire automate",d:"Au quotidien, je connecte des applications .NET au terrain : automates, serveurs OPC UA, MES et objets connectés, ainsi que les API REST et SOAP des systèmes qui les entourent."},
    mt_cloud:{t:"Cloud",d:"Azure, Azure DevOps et pipelines CI/CD pour les builds et les déploiements, avec Application Insights et Grafana pour la supervision. Certifié AZ-900 et AZ-204."},
    mt_belt:{t:"Ligne de production",d:"Workflows et orchestration : concevoir la façon dont des applications distribuées s'échangent données et tâches de manière fiable, de la machine jusqu'au cloud."},
    ga_wall:{t:"Vue opérateur",d:"Les alarmes des bâtiments et des installations arrivent sur l'écran de l'opérateur. Il les acquitte, déclenche les alertes et suit chaque intervention jusqu'au bout."},
    ga_plc:{t:"Entrées terrain",d:"Les alarmes viennent d'automates Siemens S7 sur site et de capteurs IoT connectés via le cloud."},
    ga_console:{t:"Client opérateur",d:"Un client lourd WPF (DevExpress) dialogue avec un service métier WCF, avec Autofac pour l'injection de dépendances, sur .NET Framework 4.6.1 et .NET 7."},
    ga_door:{t:"Accès sécurisé",d:"Une salle de contrôle de sécurité ne s'ouvre pas à tout le monde : badge obligatoire. Pour vous, la porte fait une exception."},
    ga_cctv:{t:"Mur d'images",d:"Dans une salle de contrôle, les images des caméras complètent les alarmes : l'opérateur voit ce qui se passe avant d'envoyer quelqu'un."},
    ga_ops:{t:"Opérateurs",d:"Les opérateurs se relaient devant les écrans, jour et nuit. Le logiciel doit leur faire gagner chaque seconde."},
    ga_alert:{t:"Chaîne d'alerte",d:"Quand une alarme demande une action, le système appelle et envoie des SMS aux personnes de permanence, et peut alerter les pompiers."},
    ga_db:{t:"Base et maintenance",d:"NHibernate et FluentMigrator sur SQL Server. En production, je remonte les bugs jusqu'à leur cause : par exemple avec un trigger d'audit et des Extended Events pour trouver une requête qui effaçait des données, puis restaurer les lignes perdues."},
    gr_planner:{t:"Downtime Planner",d:"Mon module principal : les arrêts de production, maintenance comprise, sont planifiés et suivis en regard des ordres de fabrication."},
    gr_line:{t:"Ligne de conditionnement",d:"gears 4.0 sert le conditionnement pharmaceutique : les ordres de fabrication et les données de référence décrivent ce que produit chaque ligne."},
    gr_teams:{t:"Plannings d'équipes",d:"La planification des équipes se trouve dans la même plateforme, à côté des ordres et des arrêts."},
    gr_cloud:{t:"Sous le capot",d:".NET 10, ASP.NET Core et Blazor WebAssembly avec EF Core sur SQL Server, plus Azure Functions et des pipelines YAML sur Azure DevOps."},
    is_autoclave:{t:"Autoclaves",d:"Un service collecteur lit en temps réel les capteurs des autoclaves des clients en OPC UA, cycle après cycle."},
    is_cloud:{t:"Passage à Azure",d:"L'application était installée chez chaque client. Je l'ai migrée vers Azure, avec Azure SQL, Storage et un pipeline de build cloud."},
    is_tenants:{t:"Une base par client",d:"Multi-tenant par conception : chaque nouveau client reçoit sa propre base, créée automatiquement. J'ai aussi développé la gestion des clients, l'authentification et les clés d'API."},
    is_recipes:{t:"Analyse des recettes",d:"Dans l'application web (Angular), les clients analysent leurs cycles pour optimiser leurs futures recettes de stérilisation."},
    dc_mes:{t:"Ordre MES",d:"Un ordre arrive du MES ou d'un autre système. L'application choisit la machine active et la paramètre automatiquement avant de lancer la production."},
    dc_adapters:{t:"Adaptateurs machine",d:"Chaque type de machine est intégré par son propre adaptateur. Ajouter une machine, c'est écrire un adaptateur, pas modifier le cœur."},
    dc_printer:{t:"Imprimante d'étiquettes",d:"La machine intégrée aujourd'hui : une imprimante d'étiquettes, paramétrée pour chaque ordre et pilotée pendant la production."},
    dc_ui:{t:"Application et installeur",d:"API ASP.NET Core avec FastEndpoints, interface Blazor WebAssembly, EF Core sur SQL Server, logs Serilog, et un installeur MSI réalisé avec WiX pour les lignes de production."},
    dc_logs:{t:"Support en production",d:"Après un redémarrage, l'application plantait parfois au démarrage chez le client. En croisant ses logs avec l'Observateur d'événements Windows, j'ai vu que le réseau du domaine n'était pas encore prêt : les appels au démarrage dépassaient la limite d'IIS. Correctif : une limite plus longue et des appels réseau découplés du démarrage."},
    dp_graph:{t:"Éditeur de plans",d:"Les déploiements se dessinent sous forme de graphe dans un éditeur visuel. Le moteur l'exécute avec des branchements et des étapes en parallèle."},
    dp_agents:{t:"Agents",d:"Un agent sur chaque serveur Windows exécute les actions en local (fichiers, services, SQL, PowerShell) et dialogue directement avec le backend principal. Il se met à jour en un clic depuis l'interface."},
    dp_dash:{t:"Tableau de bord",d:"Interface Blazor et MudBlazor mise à jour en direct via SignalR : déploiements, métriques machines et journaux Windows. Connexion Entra ID avec rôles personnalisés ; CI sur GitHub Actions."},
    ai_orch:{t:"Orchestrateur",d:"Un orchestrateur découpe le travail et confie chaque tâche à un agent spécialisé, avec une reprise sur erreur quand une étape échoue."},
    ai_agents:{t:"Agents spécialisés",d:"Chaque agent a une responsabilité claire et échange du JSON structuré avec les autres, avec des modèles servis par Azure AI Foundry."},
    ai_belt:{t:"Workflow de tests",d:"Les scénarios sont récupérés, les tests web exécutés et les preuves collectées. Le même objectif que mon stage chez Peakboard en 2020, cette fois avec des agents."},
    ai_report:{t:"Rapports",d:"Chaque exécution se termine par un rapport structuré, rapide à relire."},
    ai_vault:{t:"Infrastructure interne",d:"Conçu pour tourner isolé sur des serveurs Linux internes. L'objectif : héberger nos propres modèles en interne, pour que les données ne quittent jamais l'entreprise."},
    cert_az900:{t:"Azure Fundamentals (AZ-900)",d:"Obtenue en janvier 2025. Concepts du cloud, services Azure principaux, sécurité, gouvernance et gestion des coûts."},
    cert_az204:{t:"Azure Developer Associate (AZ-204)",d:"Obtenue en janvier 2026. Développer des solutions cloud sur Azure : calcul, stockage, sécurité, supervision et intégration des services Azure."},
    val_own:{t:"Prendre les choses en main",d:"J'ai conçu la plateforme de déploiement, de l'interface aux agents et à la CI, et la passerelle MES – machines depuis son architecture."},
    val_rel:{t:"Fiable quand ça compte",d:"Je maintiens un système de sécurité qui peut alerter les pompiers. Quand un bug touche la production, je remonte jusqu'à la cause et je le corrige durablement."},
    val_auto:{t:"Automatiser ce qui fait perdre du temps",d:"Tests UI automatisés chez Peakboard, déploiements automatisés avec ma propre plateforme, agents IA pour la validation : j'outille l'équipe pour qu'elle avance plus vite."},
    val_learn:{t:"Apprendre vite",d:"Object Pascal pris en main pendant un stage, deux certifications Azure, l'IA agentique explorée sur mon temps libre : les nouveaux outils ne me font pas peur."},
    val_last:{t:"Construire pour durer",d:"Un adaptateur par machine, une base par client, un moteur en graphe : je conçois pour que la prochaine fonctionnalité trouve sa place sans casser le reste."},
    val_user:{t:"Proche des utilisateurs",d:"Modes démo pour les présentations client, outils pensés pour les opérateurs en salle de contrôle : j'explique le technique simplement, en trois langues."},
    road_sign:{t:"Prochain chapitre",d:"Toutes les flèches pointent dans la même direction : la suite. Je continue d'apprendre, de construire, et de chercher de bons problèmes à résoudre."},
    road_horizon:{t:"Horizon des trois pays",d:"D'ici, on voit les Vosges, la Forêt-Noire et le Jura : trois pays sur un même horizon, comme mon parcours."},
    lab_ai:{t:"Terminal d'agents",d:"J'expérimente l'IA agentique : des agents qui planifient, appellent des outils et se passent le travail, avec des garde-fous et une validation humaine."},
    lab_bench:{t:"Établi",d:"Microcontrôleurs, capteurs et fer à souder : là où les habitudes de l'industrie rencontrent les projets perso."},
    lab_hoop:{t:"Panier de basket",d:"Joueur de basket en compétition. L'idée en cours : des capteurs sur le joueur et un modèle qui analyse les tirs, le placement et les déplacements à l'entraînement."}
  }
},

const CAREER_START=new Date(2022,0,1);
(function resolveDurations(){
  const yrs=(Date.now()-CAREER_START.getTime())/(365.25*864e5), n=Math.floor(yrs), f=yrs-n;
  const W={fr:['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze'],
           en:['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'],
           de:['null','ein','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf']};
  const unit={fr:k=>k>1?'ans':'an',en:k=>k>1?'years':'year',de:k=>k>1?'Jahre':'Jahr'};
  const pre={fr:['','bientôt ','plus de '],en:['','almost ','over '],de:['','bald ','über ']};
  function phrase(lang,words){
    let k=n, mode=0;
    if(f>=0.75){ k=n+1; mode=1; } else if(f>=0.2){ mode=2; }
    const num=words&&k<W[lang].length?W[lang][k]:String(k);
    return pre[lang][mode]+num+' '+unit[lang](k);
  }
  const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
  function walk(o,lang){
    for(const k in o){
      const v=o[k];
      if(typeof v==='string'&&v.indexOf('{')>=0){
        o[k]=v.replace('{ysent}',phrase(lang,true)).replace('{Ysent}',cap(phrase(lang,true))).replace('{ynum}',phrase(lang,false)).replace('{Ynum}',cap(phrase(lang,false)));
      } else if(v&&typeof v==='object') walk(v,lang);
    }
  }
  for(const lang in L) walk(L[lang],lang);
})();

const propsCanvas=document.createElement('canvas'); const OCCL=[];
function buildOccluders(baseImg){
  propsCanvas.width=WORLD_W; propsCanvas.height=WORLD_H2;
  const cur=w.getImageData(0,0,WORLD_W,WORLD_H2), a=cur.data, b=baseImg.data, W=WORLD_W;
  const roadX0=RX(ROAD_I), roadX1=roadX0+ROOM_W;
  const out=new ImageData(WORLD_W,WORLD_H2), o=out.data;
  for(let i=0,px=0;i<a.length;i+=4,px++){
    const x=px%W;
    if(x>=roadX0&&x<roadX1) continue;
    if(a[i]!==b[i]||a[i+1]!==b[i+1]||a[i+2]!==b[i+2]){ o[i]=a[i]; o[i+1]=a[i+1]; o[i+2]=a[i+2]; o[i+3]=255; }
  }
  propsCanvas.getContext('2d').putImageData(out,0,0);
  const mask=(x,y)=>o[(y*W+x)*4+3]>0;
  solids.forEach(sd=>{
    if(!sd.sh) return;
    const road=sd.x>=roadX0&&sd.x<roadX1;
    let top=sd.y;
    if(!road){
      for(let y=sd.y-1;y>=Math.max(0,sd.y-60);y--){
        let any=false; for(let x=Math.max(0,sd.x);x<Math.min(W,sd.x+sd.w);x++){ if(mask(x,y)){ any=true; break; } }

    OCCL.push({x:sd.x,y:top,w:sd.w,h:sd.y+sd.h-top,base:sd.y+sd.h,road});
  });
}
const OCC_HITS=[];
function occlude(c,ax,ay,aw,ah,foot){
  for(const oc of OCCL){
    if(foot>=oc.base) continue;
    const x0=Math.max(ax,oc.x), y0=Math.max(ay,oc.y), x1=Math.min(ax+aw,oc.x+oc.w), y1=Math.min(ay+ah,oc.y+oc.h);

}

function loadJsPDF(){
  if(window.jspdf) return Promise.resolve(window.jspdf);

function pdfSafe(t){
  const MAP={'≈':'~','→':'->','←':'<-','↑':'^','↓':'v','φ':'phi','✉':'','⬇':'','↺':'','▶':'','◀':'','■':''};
  return String(t).replace(/[^\x00-\xFF\u0152\u0153\u2013\u2014\u2018\u2019\u201C\u201D\u2022\u2026\u20AC]/g,m=>MAP[m]!=null?MAP[m]:'').trim();
}
async function saveFile(filename,blob){
  try{
    if(window.claude&&window.claude.use){ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename,data:blob}); return true; } }
  }catch(e){ if(e&&e.code==='declined') return false; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); return true;
}

      const lines=doc.splitTextToSize(pdfSafe(str),Wd-(indent||0)); const lh=size*0.42; need(lines.length*lh); doc.text(lines,L+(indent||0),y); y+=lines.length*lh+(gap==null?1.2:gap); };

  c.fillStyle='rgba(0,0,0,.22)'; c.fillRect(dx+3,Math.round(dog.y),14,2);
  c.drawImage(img,dx,dy);
  if(devMode){ c.fillStyle='#0b0d12'; c.fillRect(face==='R'?dx+12:dx+4,dy+2,4,1); }
  if(clock<barkUntil) bubble(c,Math.round(dog.x)+4,dy-1,TX().ui.woof);
  if(guiding&&!reduceMotion){ const g=guideDoor(); if(g){ const ph=Math.floor(clock*4)%3; c.fillStyle='#f2c230'; for(let k=0;k<3;k++){ if(k>ph) continue; const x=g.x+2+k*4; c.fillRect(x,g.y-4,1,1); c.fillRect(x+1,g.y-3,1,1); c.fillRect(x+2,g.y-2,1,1); c.fillRect(x+1,g.y-1,1,1); c.fillRect(x,g.y,1,1); } } }
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; clock+=dt;
  let dx=0,dy=0;
  if(mode==='free'){
    const sp=80;
    if(keys.has('left'))dx-=1; if(keys.has('right'))dx+=1; if(keys.has('up'))dy-=1; if(keys.has('down'))dy+=1;
    if(dx&&dy){dx*=.7071;dy*=.7071;}
    const nx=player.x+dx*sp*dt, ny=player.y+dy*sp*dt;
    if(!hits(nx,player.y)) player.x=nx;
    if(!hits(player.x,ny)) player.y=ny;
    if(!branch && player.y>186){ mainScroll=scrollY; branch=true; setScroller(); scrollTo({top:0,behavior:'auto'}); showToast('microtom',TX().ui.projectsDown); markNav(currentRoom); }
    else if(branch && player.y<172){ branch=false; setScroller(); scrollTo({top:mainScroll||0,behavior:'auto'}); markNav(currentRoom); }
  } else {
    const viaQ=queue.length>0;
    const tgt=viaQ?queue[0]:routePos(routeName(),scrollProgress()*uMax(routeName()));
    const vx=tgt.x-player.x, vy=tgt.y-player.y, dist=Math.hypot(vx,vy);
    if(dist<0.8||(reduceMotion&&!viaQ)){ player.x=tgt.x; player.y=tgt.y; if(viaQ) queue.shift(); }
    else { const sp=viaQ?Math.max(110,dist*4):Math.max(70,dist*7), st=Math.min(dist,sp*dt); dx=vx/dist; dy=vy/dist; player.x+=dx*st; player.y+=dy*st; }
  }
  player.moving=!!(dx||dy);
  if(player.moving){
    player.dir=Math.abs(dx)>=Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
    player.anim+=dt; dustT+=dt;
    if(dustT>0.14 && !reduceMotion){ dustT=0; dust.push({x:player.x-dx*4+(Math.random()*4-2),y:player.y+1,life:.45}); }
  } else { player.anim=0; if(mode==='auto') player.dir=(currentRoom===ROAD_I?'up':'down'); }
  for(let i=dust.length-1;i>=0;i--){ dust[i].life-=dt; dust[i].y-=dt*6; if(dust[i].life<=0) dust.splice(i,1); }

  if(player.moving||keys.size||openId||dlg.open){ idleT=0; } else idleT+=dt;
  const wasGuiding=guiding; guiding=mode==='auto'&&idleT>5&&!!guideDoor()&&!queue.length;
  if(guiding&&!wasGuiding) guideBark=clock+0.8;
  if(TOUCHNAV&&vProg!==vTarget){ const um=uMax(routeName()), d=vTarget-vProg, rate=Math.max(1/um/1.3,Math.abs(d)*2.2)*dt; vProg=Math.abs(d)<=rate?vTarget:vProg+Math.sign(d)*rate; }
  updateBall(dt);
  updateDog(dt);
  ambience(dt);
  { const pr=scrollProgress(); let wpx;
    if(branch||!navEdges.length) wpx=Math.round(pr*navWidth);
    else {
      const n=MAIN.length, u=pr*uMax('main'), k=Math.floor(u), f=u-k;
      if(k>=n-1) wpx=navEdges[n-1];
      else { const t=f<DWELL?0:ease((f-DWELL)/(1-DWELL)); wpx=navEdges[k]+(navEdges[k+1]-navEdges[k])*t; }
      wpx=Math.round(Math.max(0,Math.min(navWidth,wpx)));
    }
    if(wpx!==progW){ progW=wpx; $('progress').firstElementChild.style.width=wpx+'px'; }
    document.body.classList.toggle('branch',branch);
    const desk=!TOUCHNAV&&innerWidth>760;
    sunsetK=(currentRoom===ROAD_I&&!branch)?Math.max(0,Math.min(1,(116-player.y)/58)):0;
    const atEnd=!branch&&currentRoom===ROAD_I&&player.y<60&&(mode==='free'?Math.abs(player.x-(RX(ROAD_I)+ROOM_W/2))<34:pr>0.985);
    finaleK+=((atEnd?1:0)-finaleK)*Math.min(1,dt*(atEnd?1.1:3));
    if(document.body.classList.contains('finale')!==(finaleK>0.5)) updateStepNav();
    document.body.classList.toggle('finale',finaleK>0.5);
    $('textlayer').style.opacity=String(1-finaleK);
    if(finaleK>0.85&&!endShown){ endShown=true; renderEnd(); $('endcard').hidden=false; track('tour-end'); }
    else if(finaleK<0.5&&endShown){ endShown=false; $('endcard').hidden=true; } }
  const room=roomAt(player.x,player.y);
  const gp=player.y<WORLD_H?gapAt(player.x):null; if(gp!==lastGap){ lastGap=gp; if(gp!==null) showPlace(gp); }
  if(room!==currentRoom) enterRoom(room);

  near=null;
  if(mode==='free'){
    let best=1e9;
    HOTSPOTS.forEach(h=>{
      const px=Math.max(h.x,Math.min(player.x,h.x+h.w)), py=Math.max(h.y,Math.min(player.y-6,h.y+h.h));
      const d=Math.hypot(px-player.x,py-(player.y-6));
      if(d<22&&d<best){ best=d; near=h; }
    });
  }

  const tcx=Math.max(0,Math.min(WORLD_W-gameW,player.x-gameW/2));
  camX=gameW>=WORLD_W?-(gameW-WORLD_W)/2:tcx;
  let tcy;
  if(player.y<WORLD_H-8&&!branch) tcy=viewH>=WORLD_H?-(viewH-WORLD_H)/2:Math.max(0,Math.min(WORLD_H-viewH,player.y-viewH/2));
  else if(ROOMDEF[currentRoom]&&ROOMDEF[currentRoom].sub&&player.x>=PROJ_X-4){ const ry=RY(currentRoom); tcy=viewH>=WORLD_H?ry-(viewH-WORLD_H)/2:Math.max(ry,Math.min(ry+WORLD_H-viewH,player.y-viewH/2)); }
  else tcy=Math.max(viewH>=WORLD_H?-(viewH-WORLD_H)/2:0,Math.min(WORLD_H2-viewH,player.y-viewH/2));
  camY+=reduceMotion?(tcy-camY):(tcy-camY)*Math.min(1,dt*9);

  ctx.fillStyle='#1d2433'; ctx.fillRect(0,0,viewW,viewH);
  ctx.save(); ctx.translate(-Math.round(camX),-Math.round(camY));
  ctx.drawImage(world,0,0);
  animate(ctx,clock);
  { const inCtrl=currentRoom===7&&player.x>=RX(7)-2&&player.y>=RY(7);
    ctrlDark+=((inCtrl?0:1)-ctrlDark)*Math.min(1,dt*4);
    if(ctrlDark>0.02){ ctx.fillStyle='rgba(4,6,16,'+(0.86*ctrlDark).toFixed(3)+')'; ctx.fillRect(RX(7),RY(7)+30,ROOM_W,146);
      if(Math.floor(clock*6)%4<2){ const g=ctx.createRadialGradient(RX(7)+218,RY(7)+26,1,RX(7)+218,RY(7)+26,26); g.addColorStop(0,'rgba(255,60,50,'+(0.55*ctrlDark).toFixed(2)+')'); g.addColorStop(1,'rgba(255,60,50,0)'); ctx.fillStyle=g; ctx.fillRect(RX(7)+190,RY(7),56,56); } }
    const dx0=PROJ_X, dy0=RY(7)+120, dd=Math.hypot(player.x-dx0,player.y-dy0), op=Math.max(0,Math.min(1,1-(dd-14)/34));
    if(op>0.6&&doorOpen<0.3) noiseHit(480,0.3,0.035);
    doorOpen+=(op-doorOpen)*Math.min(1,dt*6);
    const h=Math.round(24*(1-doorOpen));
    ctx.fillStyle='#7a8496'; ctx.fillRect(dx0-6,RY(7)+96,12,h); ctx.fillRect(dx0-6,RY(7)+144-h,12,h);
    for(let k=0;k<12;k+=4){ ctx.fillStyle='#f2c230'; if(h>2){ ctx.fillRect(dx0-6+k,RY(7)+96+h-2,2,2); ctx.fillRect(dx0-6+k,RY(7)+144-h,2,2); } }
    ctx.fillStyle='#1d2433'; ctx.fillRect(dx0-12,RY(7)+104,5,8); ctx.fillStyle=doorOpen>0.5?'#4fd17a':'#d14b4b'; ctx.fillRect(dx0-11,RY(7)+105,3,2); ctx.fillStyle='#5f6878'; ctx.fillRect(dx0-11,RY(7)+108,3,3); }
  dust.forEach(p=>{ ctx.fillStyle='rgba(230,225,210,'+(p.life*1.2).toFixed(2)+')'; ctx.fillRect(Math.round(p.x),Math.round(p.y),2,1); });
  const px=Math.round(player.x), py=Math.round(player.y);
  const ps=depthScale(player.x,player.y);
  if(ps>=1){ ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(px-5,py-1,10,3); ctx.fillRect(px-4,py-2,8,5); } else { ctx.fillStyle='rgba(0,0,0,.25)'; ctx.fillRect(Math.round(player.x-5*ps),py-1,Math.max(1,Math.round(10*ps)),Math.max(1,Math.round(3*ps))); }
  const seq=[1,0,2,0], f=player.moving?seq[Math.floor(player.anim/0.13)%4]:0;
  if(player.moving&&f!==0&&f!==lastStepF) SND.step(lastGap!==null||currentRoom===ROAD_I); lastStepF=f;
  drawBall(ctx);
  const bob=player.moving&&f===0?-1:((party&&!player.moving&&currentRoom===0&&(beatPhase()%1)<.25)?-1:0);
  const dogBehind=dog.y<=player.y;
  const dogOcc=()=>occlude(ctx,dog.x-12,dog.y-12,24,14,dog.y);
  if(dogBehind){ drawDog(ctx); dogOcc(); }
  if(ps<1) ctx.drawImage(SPR[player.dir+f],player.x-8*ps,player.y-(SPR_H-1-bob)*ps,16*ps,SPR_H*ps); else ctx.drawImage(SPR[player.dir+f],px-8,py-(SPR_H-1)+bob);
  occlude(ctx,player.x-9,player.y-SPR_H-1,18,SPR_H+3,player.y);
  if(!dogBehind){ drawDog(ctx); dogOcc(); }
  if(OCC_HITS.length){ ctx.save(); ctx.beginPath(); OCC_HITS.forEach(r=>ctx.rect(r[0],r[1],r[2],r[3])); ctx.clip(); animate(ctx,clock); ctx.restore(); OCC_HITS.length=0; }
  if(devMode&&(player.dir==='down'||player.dir==='left'||player.dir==='right')){ const ey=py-(SPR_H-1)+5+bob; ctx.fillStyle='#0b0d12'; if(player.dir==='down'){ ctx.fillRect(px-5,ey,10,2); } else { ctx.fillRect(player.dir==='right'?px-1:px-3,ey,5,2); } }
  for(let k=confetti.length-1;k>=0;k--){ const q=confetti[k]; q.life-=1/60; q.x+=q.vx; q.y+=q.vy; q.vy+=0.05; if(q.life<=0){ confetti.splice(k,1); continue; } ctx.fillStyle=q.c; ctx.fillRect(Math.round(q.x),Math.round(q.y),2,2); }
  if(night) drawNight(ctx,clock);
  if(currentRoom===0 && player.x<RX(0)+ROOM_W-8 && !player.moving && !openId){ const u=TX().ui, hs=[...u.hellos, TOUCHNAV?u.helloTouch:u.helloDesk], k=Math.floor(clock/3.4)%hs.length; bubble(ctx,px,py-SPR_H-3,hs[k],140); }
  drawMarkers(ctx,clock);
  ctx.restore();
  ctx.drawImage(vignette,0,0);
  if(finaleK>0.01){
    ctx.fillStyle='rgba(6,8,24,'+(0.95*finaleK).toFixed(3)+')'; ctx.fillRect(0,0,viewW,viewH);
    for(let k=0;k<160;k++){ const x=Math.round(hash(k,11,3)*viewW), y=Math.round(hash(k,12,5)*viewH), tw=reduceMotion?1:(0.55+0.45*Math.sin(clock*1.7+k*1.3));
      ctx.fillStyle='rgba(255,252,235,'+(finaleK*(0.25+0.75*hash(k,13,7))*tw).toFixed(3)+')'; ctx.fillRect(x,y,1,1); if(hash(k,14,2)>0.93) ctx.fillRect(x-1,y,3,1),ctx.fillRect(x,y-1,1,3); }
  }
  if(tctx){
    const k=scale, o=tctx, cxr=Math.round(camX), cyr=Math.round(camY);
    o.clearRect(0,0,viewW*k,viewH*k);
    o.textBaseline='top';
    for(const L of LABELS){
      const sx=((L.x!=null?L.x:L.cx)-cxr)*k, sy=(L.y-cyr)*k;
      if(sx<-400||sx>viewW*k+20||sy<-60||sy>viewH*k+20) continue;
      if(L.key!=null){
        const t=TX().ui.valShort[L.key]; let fs=Math.max(10,L.size*k); o.font=fs+'px "Pixelify Sans", monospace';
        let tw=o.measureText(t).width; if(tw>L.maxW*k){ fs=fs*L.maxW*k/tw; o.font=fs+'px "Pixelify Sans", monospace'; tw=o.measureText(t).width; }
        o.fillStyle=L.color; o.fillText(t,(L.cx-cxr)*k-tw/2,sy+(L.size*k-fs)/2); continue;
      }
      o.font=(L.size*k)+'px "Pixelify Sans", monospace'; o.fillStyle=L.color; o.fillText(L.t,sx,sy);
    }
    for(const B of BUBBLES) drawBubbleHi(o,(B.x-cxr)*k,(B.y-cyr)*k,B.text,B.maxW,k);
  }
  BUBBLES.length=0;
  requestAnimationFrame(frame);
}
